<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5f1">

  <title>The Signature | Vanta Events</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f8f5f1;
      --white: #ffffff;
      --peach: #dba990;
      --peach-light: #f0d8ca;
      --ink: #292521;
      --muted: #77716b;
      --line: rgba(70, 57, 47, .12);
      --glass: rgba(255, 255, 255, .62);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 12%, rgba(219,169,144,.25), transparent 34%),
        radial-gradient(ellipse at 95% 78%, rgba(202,184,166,.25), transparent 32%),
        var(--paper);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      width: min(100%, 760px);
      min-height: 100vh;
      margin: auto;
      padding: 26px 22px;
      overflow: hidden;
    }

    /* Quiet decorative pattern in the background */

    .pattern {
      position: absolute;
      pointer-events: none;
      color: var(--peach);
      opacity: .24;
      z-index: 0;
    }

    .pattern-top {
      width: 210px;
      height: 210px;
      top: -85px;
      right: -70px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .pattern-top::before,
    .pattern-top::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .pattern-top::after {
      inset: 32px;
    }

    .pattern-bottom {
      width: 160px;
      height: 160px;
      bottom: 55px;
      left: -90px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .pattern-bottom::before,
    .pattern-bottom::after {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .pattern-bottom::after {
      inset: 30px;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100%, 530px);
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 2px 22px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 1px solid var(--peach);
      border-radius: 50%;
      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .header-note {
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Main invitation */

    .invitation {
      position: relative;
      margin-top: 30px;
      padding: 43px 24px 34px;
      text-align: center;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 3px;
      box-shadow:
        0 18px 55px rgba(65, 48, 36, .07),
        inset 0 0 0 1px rgba(219,169,144,.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .invitation::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(219,169,144,.32);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 23px;
      height: 23px;
      border-color: var(--peach);
      border-style: solid;
      opacity: .85;
    }

    .corner.tl {
      top: 17px;
      left: 17px;
      border-width: 1px 0 0 1px;
    }

    .corner.tr {
      top: 17px;
      right: 17px;
      border-width: 1px 1px 0 0;
    }

    .corner.bl {
      bottom: 17px;
      left: 17px;
      border-width: 0 0 1px 1px;
    }

    .corner.br {
      bottom: 17px;
      right: 17px;
      border-width: 0 1px 1px 0;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 20px 0 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(55px, 11vw, 83px);
      line-height: .95;
      font-weight: 400;
      letter-spacing: -.045em;
    }

    .title-detail {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px 0 28px;
      color: var(--peach);
    }

    .title-detail span {
      width: 34px;
      height: 1px;
      background: var(--peach);
    }

    .title-detail b {
      font-size: 13px;
      font-weight: 400;
    }

    .guest-label {
      color: var(--muted);
      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
    }

    .guest-name {
      margin: 7px 0 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: 42px;
      line-height: 1.05;
    }

    .peach-rule {
      width: 43px;
      height: 2px;
      margin: 27px auto 0;
      background: var(--peach);
    }

    /* Invitation action */

    .open-area {
      margin-top: 28px;
    }

    .open-link {
      display: inline-block;
      padding: 13px 20px;
      background: var(--ink);
      color: var(--white);
      text-decoration: none;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .13em;
      text-transform: uppercase;
      border: 1px solid var(--ink);
      transition: background .2s ease, color .2s ease;
    }

    .open-link:hover,
    .open-link:focus-visible {
      background: transparent;
      color: var(--ink);
    }

    .rsvp-note {
      max-width: 285px;
      margin: 15px auto 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
    }

    /* Reception QR section */

    .reception {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 22px;
      margin-top: 22px;
      padding: 21px;
      background: rgba(255,255,255,.67);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 10px 30px rgba(65,48,36,.045);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .reception-label {
      margin: 0 0 7px;
      color: var(--peach);
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .reception h2 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.05;
    }

    .reception-copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .qr-frame {
      width: 112px;
      min-height: 112px;
      display: grid;
      place-items: center;
      padding: 8px;
      background: white;
      border: 1px solid var(--line);
    }

    #checkin-qr {
      display: block;
      width: 94px;
      height: 94px;
    }

    .qr-status {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 8px;
      text-align: center;
      line-height: 1.5;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 25px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--peach);
      vertical-align: middle;
    }

    @media (max-width: 420px) {
      .page {
        padding: 20px 15px;
      }

      .header-note {
        font-size: 8px;
      }

      .invitation {
        margin-top: 23px;
        padding: 40px 19px 30px;
      }

      h1 {
        font-size: clamp(53px, 13vw, 68px);
      }

      .guest-name {
        font-size: 38px;
      }

      .reception {
        grid-template-columns: minmax(0, 1fr) 96px;
        gap: 12px;
        padding: 15px;
      }

      .qr-frame {
        width: 96px;
        min-height: 96px;
        padding: 5px;
      }

      #checkin-qr {
        width: 84px;
        height: 84px;
      }

      .reception h2 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="pattern pattern-top" aria-hidden="true"></div>
    <div class="pattern pattern-bottom" aria-hidden="true"></div>

    <div class="content">

      <header>
        <div class="brand">
          <span class="brand-mark">V.</span>
          <span>Vanta Events</span>
        </div>
        <div class="header-note">Private invitation</div>
      </header>

      <main>
        <section class="invitation" aria-label="Personal invitation">

          <span class="corner tl" aria-hidden="true"></span>
          <span class="corner tr" aria-hidden="true"></span>
          <span class="corner bl" aria-hidden="true"></span>
          <span class="corner br" aria-hidden="true"></span>

          <div class="eyebrow">You are invited to</div>

          <h1>The Signature</h1>

          <div class="title-detail" aria-hidden="true">
            <span></span>
            <b>✳</b>
            <span></span>
          </div>

          <div class="guest-label">For</div>
          <div class="guest-name">Vanessa</div>

          <div class="peach-rule" aria-hidden="true"></div>

          <div class="open-area">
            <a
              class="open-link"
              href="https://thehighestbeautygh.github.io/vanta-events-demo/?token=1fc1a6636da664c6674d41cf573b0670dd7dec190a29635ffee5ab749fb12c3a"
              target="_blank"
              rel="noopener"
            >Open my invitation</a>

            <p class="rsvp-note">
              Continue to the final slide to confirm your attendance.
            </p>
          </div>

        </section>

        <section class="reception" aria-label="Reception check-in">

          <div>
            <p class="reception-label">For the reception</p>
            <h2>Your check-in<br>QR code</h2>
            <p class="reception-copy">
              Keep this code ready for arrival.
            </p>
          </div>

          <div>
            <div class="qr-frame">
              <canvas
                id="checkin-qr"
                width="240"
                height="240"
                aria-label="Reception check-in QR code"
              ></canvas>
            </div>
            <p class="qr-status" id="qr-status" aria-live="polite">
              Preparing code…
            </p>
          </div>

        </section>
      </main>

      <footer>
        <span><span class="footer-dot"></span>Vanta Events</span>
        <span>The Signature</span>
      </footer>

    </div>
  </div>

  <!-- QR generation library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    /*
      SAMPLE CHECK-IN TOKEN:
      This token is for the existing Vanessa sample record only.
      Replace it with a newly generated random token before the real event.
      The QR encodes the raw token expected by the current check-in lookup.
    */
    const checkinToken =
      "7647b48dc6d23e3f1ceb8c13fb27e238653c8bcc6840d137c994be82b534d152";

    const canvas = document.getElementById("checkin-qr");
    const status = document.getElementById("qr-status");

    function drawFallback(message) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#292521";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(message, canvas.width / 2, canvas.height / 2);
    }

    function generateCheckinQR() {
      if (!window.QRCode) {
        drawFallback("QR unavailable");
        status.textContent = "Unable to load QR generator";
        return;
      }

      const holder = document.createElement("div");

      new QRCode(holder, {
        text: checkinToken,
        width: 240,
        height: 240,
        colorDark: "#292521",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      const source = holder.querySelector("canvas");

      if (source) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
        status.textContent = "Reception check-in";
        return;
      }

      const image = holder.querySelector("img");

      if (image) {
        image.onload = () => {
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          status.textContent = "Reception check-in";
        };
        image.onerror = () => {
          drawFallback("QR unavailable");
          status.textContent = "Unable to create QR";
        };
        return;
      }

      drawFallback("QR unavailable");
      status.textContent = "Unable to create QR";
    }

    generateCheckinQR();
  </script>
</body>
</html>
